name: Unit Tests

on:
  push:
  pull_request:
  schedule:
      - cron: '00 4 * * *'  # daily at 4AM

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]
        # We still test against jsonschema 2.x because pip's dependency resolver
        # very often gives us 2.x even though we ask for 3.x. The event-model
        # code has codepaths for either, conditional on what is installed.
        # See https://github.com/bluesky/event-model/pull/175 and
        # https://github.com/bluesky/event-model/issues/145 for more context.
        jsonschema-version: [2, 3]
      fail-fast: false
    steps:

    - uses: actions/checkout@v2

    - name: Dependencies C++
      run: |
        sudo apt-get update
        sudo apt-get install git build-essential cmake libeigen3-dev valgrind
        sudo ln -s /usr/include/eigen3/Eigen /usr/include/Eigen
        ls /usr/include

  # - name: Set up Python ${{ matrix.python-version }}
  #   uses: actions/setup-python@v2
  #   with:
  #   python-version: ${{ matrix.python-version }}

    - name: Set up Python ${{ matrix.python-version }} with conda
      uses: conda-incubator/setup-miniconda@v2
      with:
        activate-environment: ${{ env.REPOSITORY_NAME }}-py${{ matrix.python-version }}
        auto-update-conda: true
        miniconda-version: "latest"
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      shell: bash -l {0}
      run: python -m pip install Cython
    - name: Install
      shell: bash -l {0}
      run: source continuous_integration/scripts/install.sh

    - name: Install test requirements
      shell: bash -l {0}
      run: |
        set -vxeuo pipefail
        python -m pip install -r requirements-dev.txt
        python -m pip list

    - name: Pin jsonschema
      shell: bash -l {0}
      run: |
        set -vxeuo pipefail
        python -m pip install --upgrade "jsonschema==${{ matrix.jsonschema-version }}.*"
        python -m pip list

    - name: Test with pytest
      shell: bash -l {0}
      run: |
        set -vxeuo pipefail
        coverage run -m pytest -v
        coverage report
